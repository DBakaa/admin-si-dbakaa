---
- name: Configuration durcie de sshd, validee avant ecriture
  ansible.builtin.template:
    src: 00-ansible.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger ssh

- name: Configuration complete de sshd valide
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: Service ssh actif au demarrage
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
